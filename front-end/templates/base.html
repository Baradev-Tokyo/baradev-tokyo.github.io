{% load i18n %}
{% load static %}
<!doctype html>
{% get_current_language as language %}
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% translate "Bara | Freelance Software Engineering & Development" %}{% endblock %}</title>
  <meta name="description" content="{% translate "Freelance websites, dashboards and workflow automation for small teams." %}">
  <meta name="theme-color" content="#0D2036">
  <link rel="stylesheet" href="{% static 'main.css' %}">
</head>
<body>
  <a class="skip-link" href="#main">{% translate "Skip to content" %}</a>
  {% include "navbar.html" %}
  <main id="main">{% block content %}{% endblock %}</main>
  {% include "footer.html" %}
</body>
</html>
