      <span>{% translate 'Contact' %}</span>
      <a href="mailto:baradev.tokyo@gmail.com" data-analytics-event="email_click">baradev.tokyo@gmail.com</a>
    </div>
    <a href="https://github.com/ByteBard0727">GitHub</a>
    <div class="bara-footer-contact">
      <a href="{% url 'privacy' %}">{% if footer_language == 'ja' %}プライバシーポリシー{% else %}Privacy policy{% endif %}</a>

      {% endif %}
    </div>

</footer>
