name: Validate Bara foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-validation-key
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-reporting.txt
      - run: python manage.py check
        working-directory: bara_home
      - run: python manage.py makemigrations --check --dry-run
        working-directory: bara_home
      - run: python manage.py test
        working-directory: bara_home
      - run: python scripts/build_pages.py && python scripts/check_pages.py
      - run: python scripts/build_pages.py && python scripts/check_pages.py
        env:
          BARA_GA_MEASUREMENT_ID: G-VALIDATE01

  reporting-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bara_ci
          POSTGRES_PASSWORD: local-ci-password
          POSTGRES_DB: bara_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bara_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-validation-key
      BARA_DB_HOST: 127.0.0.1
      BARA_DB_NAME: bara_ci
      BARA_DB_USER: bara_ci
      BARA_DB_PASSWORD: local-ci-password
      BARA_DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-reporting.txt
      - run: python manage.py test reporting operations
        working-directory: bara_home
