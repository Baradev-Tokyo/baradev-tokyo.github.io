name: Publish Bara portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'baradev-tokyo/baradev-tokyo.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/configure-pages@v5
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_pages.py
        env:
          BARA_GA_MEASUREMENT_ID: ${{ vars.BARA_GA_MEASUREMENT_ID }}
          BARA_GOOGLE_SITE_VERIFICATION: ${{ vars.BARA_GOOGLE_SITE_VERIFICATION }}
      - run: python scripts/check_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@v4
