<!doctype html>
<html lang="{{ language }}">
<head><meta charset="utf-8"><title>{{ title }}</title></head>
<body>
  <h1>{{ title }}</h1>
  <p>{{ period }}</p>
  {% if introduction %}<p>{{ introduction|linebreaksbr }}</p>{% endif %}
  {% if rows %}<table border="1" cellpadding="7" style="border-collapse:collapse;color:#112942">
    <tbody>{% for label, amount in rows %}<tr><th scope="row" align="left">{{ label }}</th><td>{{ amount }}</td></tr>{% endfor %}</tbody>
  </table>{% endif %}
  <p>{{ note }}</p>
</body>
</html>
